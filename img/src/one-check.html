<!-- one-check: 1 回のチェックで起きること（記事「仕組み」の「1 回のチェックで起きること」、README の手順 3）。
     本文との対応（記事の番号つきの説明 1〜5、README 手順 3 の「図の 1 と 5 は、あなたが CloudShell で行う操作と、その結果の受け取りです。
     2〜4 は、Access Analyzer が自動で行う処理です。」）:
       1 AWS CLI が、確かめるポリシーと問いを Access Analyzer の API に送る。CheckAccessNotGranted は POST /policy/check-access-not-granted（iaa-005、D-10）。
         コマンドは aws accessanalyzer check-access-not-granted。パラメータは --policy-document（確かめるポリシー）・--access（許可してはいけないアクセス）・
         --policy-type（ポリシーの種類）（iaa-030〜iaa-032）。
       2 Access Analyzer が、ポリシーと問いを論理式として扱う。3 問いに当てはまるリクエストがあるかを調べる。
         2 と 3 は説明のために簡略化した処理（API の説明文に内部の処理は書かれていない。Zelkova は公式サンプルの CheckNoNewAccess の記述だけのため、図に書かない。iaa-007）。
       4 Access Analyzer が、結果・メッセージ・理由を返す（応答は result・message・reasons だけ。iaa-035）。
       5 AWS CLI が、受け取った JSON を表示する。
       - チェックはリソースを作成せず、ポリシーをどこにもアタッチしない（iaa-042）。東京リージョンで 1 回 $0.002（iaa-081）。
