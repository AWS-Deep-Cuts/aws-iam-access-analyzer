<!-- puzzle-flow: 4 クイーン問題を解く流れ（README の手順 7-2〜7-6、記事「Access Analyzer で N クイーン問題を解く」）。
     本文との対応（README の手順 7 の見出しと「この手順で確かめること」）:
       段 1・2 = 7-2「3 クイーンと 4 クイーンを問い合わせる」: 3 クイーンは PASS（置き方は無い）、4 クイーンは FAIL（置き方があるかもしれない。置き方は返らない）。
       段 3a・3b = 7-3「1 行目のクイーンを固定して問い合わせる」: 1 列目に固定すると PASS、2 列目に固定すると FAIL（make-queens.py の --fix 1=1 / 1=2）。
       段 4 = 7-4「残りの行を盤の上で決める」: API を呼び出さない。1 行目が 2 列目なら、2 行目は 4 列目、3 行目は 1 列目、4 行目は 3 列目（D-12）。置き方 2, 4, 1, 3。
       段 5a = 7-5: ポリシーシミュレーター SimulateCustomPolicy で置き方 2, 4, 1, 3 を評価すると allowed（iaa-120、iaa-121）。
       段 5b（7-6: 置き方 2, 4, 1, 4 は explicitDeny、決め手は 22 行目 Row2Col4VsRow4）は描かない。記事の本文に置き方 2, 4, 1, 4 も 22 行目も出てこず、
         記事だけを読む人には行番号が分からないため（2026-11-04 の指摘。README は手順 7-6 の本文で説明している）。
       - チェックは指定したアクセスのチェック CheckAccessNotGranted。PASS は「許可しない」、FAIL は「許可しうる」（iaa-033）。応答に置き方は含まれない（iaa-035、iaa-129）。
       - 右の枠の答えは、筆者の計算から予想した結果（記事「この節の PASS・FAIL と判定は、筆者の計算から予想した結果です」、README の「期待する結果」）。
         DESIGN §0.3 の PoC で実際の結果を確かめたら、図の下の 1 行を消す。要確認: PoC の結果で、右の枠の答えと図の下の注記を見直す。
     幅の内訳: 左の枠「あなたが行う操作」456 ＋ 間 56 ＋ 右の枠「AWS が返す答え」288 = 800。中身の幅は左 408、右 240。
       DESIGN の 432・64・304 から、段 2 の「置き方があるかもしれない」と、段 3 の「1 行目を 1 列目に固定して問い合わせる」が 1 行に収まるように変えた。
     段（左の箱と右の箱の中心の高さをそろえ、横の矢印でつなぐ）。DESIGN の段 3 は左右に 2 つ並べる形だったが、横の矢印が隣の箱を横切るため、3a と 3b の 2 段に分けた。
       段 1 y 64〜136（72）、段 2 160〜256（96）、段 3a 280〜328（48）、段 3b 352〜400（48）、段 4 440〜610（170）、段 5a 650〜714（64。左の箱を 2 行にした）。
     高さの内訳: 見出し 40 ＋ 24 ＋ 段の合計 498 ＋ 段の間 152（24・24・24・40・40）＋ 24 = 738。その下に 18 ＋ 注記 22 ＋ 2。合計 780。 -->

<script>
window.addEventListener('load', async () => { await document.fonts.ready;
  // 横の矢印（左の箱の右端 x = 432 → 右の箱の左端 x = 536）。中心の高さ: 100、208、304、376、682
  for (const y of [100, 208, 304, 376, 682]) path([[434, y], [532, y]]);

  path([[228, 124], [228, 180]]);   // 段 1 → 段 2

  path([[228, 328], [228, 348]]);   // 段 3a → 段 3b
  path([[228, 400], [228, 436]]);   // 段 3b → 段 4
  path([[228, 610], [228, 646]]);   // 段 4 → 段 5a
  document.body.dataset.ready = '1';
});
